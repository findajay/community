name: Deploy Fließend to GitHub Pages

# Builds the static export and publishes it to GitHub Pages so the app can be
# opened on any phone over HTTPS (needed for microphone access on Android).
#
# One-time setup: in the repo, go to Settings → Pages → "Build and deployment"
# → Source: "GitHub Actions". After that, every push to this branch redeploys.

on:
  push:
    branches:
      - claude/german-learning-app-c1-f2lx7l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Serve from the repo subpath, e.g. https://<user>.github.io/community/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
